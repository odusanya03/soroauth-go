# The soroauth Rust crate. It is not published and is not part of any
# workspace: it exists so the Soroban tooling ecosystem, which is Rust, can
# build, sign and check authorization entries with the same bytes the Go
# library emits.
[package]
name = "soroauth"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.0"
description = "Build, sign and inspect Soroban authorization entries, byte-identical to soroauth-go"
license = "Apache-2.0"
repository = "https://github.com/soroauth/soroauth-go"
documentation = "https://github.com/soroauth/soroauth-go/tree/main/bindings/rust"

[lib]
name = "soroauth"
path = "src/lib.rs"

[dependencies]
# Pinned exactly. A byte-equality result is only evidence when it comes from
# a named build; build.rs bakes the resolved version into the crate and
# require_pinned refuses to run against anything else. 28.0.0 is the release
# carrying the CAP-71 arms, and the same pin the parity harness proves
# against — the policy is stated in README.md and never widened to a range.
stellar-xdr = { version = "=28.0.0", features = ["base64"] }
# The strkey version stellar-xdr 28.0.0 itself resolves (see Cargo.lock);
# pinned exactly for the same reason.
stellar-strkey = "=0.0.13"
sha2 = "=0.10.9"
hex = "=0.4.3"
ed25519-dalek = "=2.1.1"
serde_json = "=1.0.143"

[dev-dependencies]
serde_json = "=1.0.143"
